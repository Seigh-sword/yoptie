name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --console=plain 2>&1 | tee build.log | grep -aE "error:|warning:|FAILURE:|What went wrong" | while IFS= read -r line; do echo "::error title=build::$line"; done

      - name: Report jar packaging details
        run: |
          jar_file=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "::notice title=jar::$jar_file $(wc -c < "$jar_file") bytes"
          echo "::notice title=entries::$(unzip -l "$jar_file" | tail -n +4 | head -n -2 | awk '{print $4}' | tr '\n' ' ') ------- files"
          echo "::notice title=mixins-config::$(unzip -p "$jar_file" yoptie.client.mixins.json | tr -d '\n\t')"

      - name: Verify mixins against real Minecraft classes
        run: |
          set +e
          ./gradlew test --console=plain > test.log 2>&1
          status=$?
          grep -a "::notice" test.log | while IFS= read -r line; do echo "::notice title=yoptie-verify::${line##*::}"; done
          if [ "$status" -ne 0 ]; then
            summary=$(grep -aE "YOPTIE-DIAGNOSTIC|VERIFY|AssertionError|FAILED|compileTestJava|error:|Caused by" test.log | tr '\n' '~' | cut -c1-9000)
            echo "::error title=yoptie-verify::$summary"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
