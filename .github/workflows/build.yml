# Builds the mod on every push and pull request, verifies the produced jar and
# checks that every mixin still lands on a real Minecraft target.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set +e
          ./gradlew build -x test --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "error:|FAILURE:|Execution failed|Caused by|What went wrong|Could not|FAILED" build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=gradle::$(printf '%s' "$line" | tr -d '\r' | cut -c1-800)"
            done
            echo "::error title=build::gradle exited with code $status"
          fi
          exit "$status"
      - name: verify jar
        if: always()
        run: |
          jar_file=$(ls build/libs/yoptie-*.jar 2>/dev/null | grep -v sources | head -n 1)
          if [ -z "$jar_file" ]; then
            echo "::error title=jar::no jar was produced"
            exit 1
          fi
          echo "::notice title=jar::$(basename "$jar_file") $(stat -c%s "$jar_file") bytes"
          listing=$(unzip -l "$jar_file" | sed -n '4,$p' | awk 'NF>1 {print $NF}' | tr '\n' ' ')
          echo "::notice title=entries::$(printf '%s' "$listing" | cut -c1-3000)"
          echo "::notice title=mixins-config::$(unzip -p "$jar_file" yoptie.client.mixins.json | tr -d '\n\t ' | cut -c1-1500)"
      - name: verify mixins
        if: always()
        run: |
          set +e
          ./gradlew test --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "AssertionError|is missing|error:|FAILED|FAILURE:|Caused by|What went wrong|Exception|Mixin" test.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=verify::$(printf '%s' "$line" | tr -d '\r' | cut -c1-800)"
            done
            echo "::error title=verify::mixin verification failed with code $status"
          fi
          exit "$status"
      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
